<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我们的1000天 · 唯一</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        background: linear-gradient(135deg,#0f0c1f 0%,#1a0b2e 40%,#2d0b3a 100%);
        min-height:100vh; display:flex; justify-content:center; align-items:center;
        font-family:'Microsoft YaHei','PingFang SC',sans-serif;
        overflow:hidden; position:relative;
    }
    .star {
        position:absolute; background:#fff; border-radius:50%; opacity:.6;
        animation:twinkle 3s infinite alternate;
    }
    @keyframes twinkle {
        0% { opacity:.2; transform:scale(.8); }
        100% { opacity:.9; transform:scale(1.2); }
    }
    #startScreen {
        position:fixed; inset:0; background:rgba(10,5,20,.95);
        display:flex; flex-direction:column; justify-content:center; align-items:center;
        z-index:100; transition:opacity .8s ease;
    }
    #startScreen h1 {
        color:#ff6b9d; font-size:28px; margin-bottom:12px; letter-spacing:4px;
        text-shadow:0 0 20px rgba(255,107,157,.6);
    }
    #startScreen p { color:#c9b6d6; font-size:15px; margin-bottom:30px; letter-spacing:2px; }
    #startBtn {
        padding:16px 48px; font-size:18px; color:#fff;
        background:linear-gradient(135deg,#ff6b9d,#c44569);
        border:none; border-radius:50px; cursor:pointer; letter-spacing:3px;
        box-shadow:0 0 30px rgba(255,107,157,.4);
        transition:transform .3s, box-shadow .3s;
        animation:pulseBtn 2s infinite;
    }
    #startBtn:hover { transform:scale(1.06); box-shadow:0 0 50px rgba(255,107,157,.7); }
    @keyframes pulseBtn {
        0%,100% { box-shadow:0 0 30px rgba(255,107,157,.4); }
        50% { box-shadow:0 0 55px rgba(255,107,157,.8); }
    }
    #gameContainer {
        position:relative; width:100vw; height:100vh;
        display:flex; flex-direction:column; justify-content:center; align-items:center;
        opacity:0; transition:opacity 1.2s ease; pointer-events:none;
    }
    #gameContainer.active { opacity:1; pointer-events:auto; }
    .days-text {
        color:#fff; font-size:22px; letter-spacing:3px; margin-bottom:10px;
        text-shadow:0 0 20px rgba(255,107,157,.5);
        z-index:10; text-align:center; padding:0 20px; pointer-events:none;
    }
    .days-text span {
        color:#ff6b9d; font-size:42px; font-weight:bold; display:block;
        margin-bottom:4px; font-family:'Georgia',serif;
    }
    .sub-text {
        color:#c9b6d6; font-size:14px; letter-spacing:2px; margin-bottom:30px;
        z-index:10; text-align:center; pointer-events:none;
    }
    #heartCanvas {
        position:absolute; top:0; left:0; width:100%; height:100%; z-index:1;
    }
    
    /* ========= 弹窗和照片的样式 ========= */
    #finalMessage {
        position:absolute; top:50%; left:50%;
        transform:translate(-50%,-50%) scale(0);
        background:rgba(20,10,35,.92);
        border:1px solid rgba(255,107,157,.4);
        border-radius:20px; padding:30px 25px; text-align:center;
        z-index:50; opacity:0; pointer-events:none;
        transition:all .6s cubic-bezier(.175,.885,.32,1.275);
        backdrop-filter:blur(10px); max-width:90vw; width:340px;
        box-shadow:0 0 60px rgba(255,107,157,.2);
    }
    #finalMessage.show { opacity:1; transform:translate(-50%,-50%) scale(1); pointer-events:auto; }
    
    /* 照片样式 */
    #finalMessage .couple-photo {
        width: 100%;
        max-height: 220px;
        object-fit: cover;
        border-radius: 12px;
        border: 3px solid rgba(255, 107, 157, 0.6);
        box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
        margin-bottom: 20px;
        opacity: 0;
        transform: translateY(10px);
        transition: all 1s ease 0.3s;
    }
    #finalMessage.show .couple-photo { opacity: 1; transform: translateY(0); }

    #finalMessage p { color:#ffe0eb; font-size:17px; line-height:1.9; letter-spacing:1px; }
    #finalMessage .highlight { color:#ff6b9d; font-weight:bold; font-size:20px; }
    #finalMessage .song-line {
        color:#a78bba; font-size:13px; margin-top:18px; letter-spacing:1px;
        border-top:1px solid rgba(255,107,157,.15); padding-top:16px;
    }
    #musicToggle {
        position:fixed; bottom:20px; right:20px; width:44px; height:44px;
        border-radius:50%; background:rgba(255,107,157,.15);
        border:1px solid rgba(255,107,157,.35); color:#ff6b9d; font-size:20px;
        cursor:pointer; z-index:200; display:none; justify-content:center; align-items:center;
        transition:background .3s;
    }
    #musicToggle.show { display:flex; }
    #musicToggle:hover { background:rgba(255,107,157,.3); }
</style>
</head>
<body>

<div id="startScreen">
    <h1>我们的 1000 天</h1>
    <p>有一首歌，只想放给你听</p>
    <button id="startBtn">▶ 点击开始</button>
</div>

<div id="gameContainer">
    <div class="days-text"><span id="dayCount">0</span>天</div>
    <div class="sub-text">轻触爱心，每一次都是一句没说出口的喜欢</div>
    <canvas id="heartCanvas"></canvas>
    
    <!-- 弹窗区域 -->
    <div id="finalMessage">
        <!-- 这里的 src 对应你传上去的照片名字，如果是 png 格式就改成 photo.png -->
        <img src="photo.jpg" alt="我们的合照" class="couple-photo">
        
        <p>
            1000 天，<br>
            <span class="highlight">你依然是我唯一的答案。</span>
        </p>
        <p class="song-line">“我真的爱你，句句不轻易”<br>——《唯一》</p>
    </div>
</div>

<button id="musicToggle" title="暂停/播放音乐">🎵</button>

<audio id="bgMusic" loop preload="auto">
    <source src="unique.mp3" type="audio/mpeg">
</audio>

<script>
const START_DATE = new Date('2024-02-11');
const TARGET_DAYS = 1000;

const canvas = document.getElementById('heartCanvas');
const ctx = canvas.getContext('2d');
const dayCountEl = document.getElementById('dayCount');
const finalMessage = document.getElementById('finalMessage');
const startScreen = document.getElementById('startScreen');
const gameContainer = document.getElementById('gameContainer');
const startBtn = document.getElementById('startBtn');
const bgMusic = document.getElementById('bgMusic');
const musicToggle = document.getElementById('musicToggle');

let width, height, particles = [], heartPoints = [], currentDay = 0, hasReachedTarget = false;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    generateHeartPoints();
    createStars();
}
window.addEventListener('resize', resize);

function createStars() {
    document.querySelectorAll('.star').forEach(el => el.remove());
    for (let i = 0; i < 80; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const size = Math.random() * 2.5 + 0.8;
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.animationDelay = (Math.random() * 3) + 's';
        document.body.appendChild(s);
    }
}

function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
function heartY(t) { return -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)); }

function generateHeartPoints() {
    heartPoints = [];
    const scale = Math.min(width, height) / 42;
    const steps = 260;
    const centerX = width / 2;
    const centerY = height / 2 + 20;

    for (let i = 0; i < steps; i++) {
        const t = (i / steps) * Math.PI * 2;
        let x = heartX(t) * scale + (Math.random() - .5) * 6;
        let y = heartY(t) * scale + (Math.random() - .5) * 6;
        heartPoints.push({
            baseX: centerX + x, baseY: centerY + y,
            phase: Math.random() * Math.PI * 2,
            speed: .02 + Math.random() * .03,
            size: 2 + Math.random() * 2.5,
            color: `hsl(${330 + Math.random()*30},100%,${60 + Math.random()*20}%)`
        });
    }
}

class Particle {
    constructor(x, y) {
        this.x = x; this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 1.8 + .4;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - .6;
        this.life = 1;
        this.decay = .008 + Math.random() * .012;
        this.size = Math.random() * 4 + 1.5;
        this.color = `hsl(${330 + Math.random()*40},100%,${55 + Math.random()*30}%)`;
        this.isHeart = Math.random() < .35;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        this.vy += .03; this.vx *= .995; this.life -= this.decay;
    }
    draw() {
        if (this.life <= 0) return;
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        if (this.isHeart) {
            const s = this.size * .8;
            ctx.beginPath();
            ctx.moveTo(this.x, this.y + s*.4);
            ctx.bezierCurveTo(this.x - s, this.y - s*.6, this.x - s*.5, this.y - s*1.2, this.x, this.y - s*.4);
            ctx.bezierCurveTo(this.x + s*.5, this.y - s*1.2, this.x + s, this.y - s*.6, this.x, this.y + s*.4);
            ctx.fill();
        } else {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }
}

function render() {
    ctx.clearRect(0, 0, width, height);
    heartPoints.forEach(p => {
        p.phase += p.speed;
        const px = p.baseX + Math.sin(p.phase) * 2.2;
        const py = p.baseY + Math.cos(p.phase * .8) * 2.2;
        ctx.beginPath();
        ctx.arc(px, py, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = .55 + Math.sin(p.phase) * .25;
        ctx.fill();
        ctx.globalAlpha = 1;
    });
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
    requestAnimationFrame(render);
}

function onHeartClick(e) {
    const rect = canvas.getBoundingClientRect();
    let clickX, clickY;
    if (e.touches) {
        clickX = e.touches[0].clientX - rect.left;
        clickY = e.touches[0].clientY - rect.top;
    } else {
        clickX = e.clientX - rect.left;
        clickY = e.clientY - rect.top;
    }
    const centerX = width / 2;
    const centerY = height / 2 + 20;
    const scale = Math.min(width, height) / 42;
    const heartRadius = 17 * scale;
    const dist = Math.sqrt((clickX - centerX) ** 2 + (clickY - centerY) ** 2);
    if (dist > heartRadius * 1.05) return;

    const count = 18 + Math.floor(Math.random() * 12);
    for (let i = 0; i < count; i++) particles.push(new Particle(clickX, clickY));

    if (currentDay < TARGET_DAYS) {
        currentDay = Math.min(currentDay + Math.floor(Math.random() * 15) + 6, TARGET_DAYS);
        animateNumber(currentDay);
    }
    if (currentDay >= TARGET_DAYS && !hasReachedTarget) {
        hasReachedTarget = true;
        setTimeout(() => finalMessage.classList.add('show'), 500);
    }
}

function animateNumber(target) {
    const start = parseInt(dayCountEl.textContent) || 0;
    const t0 = performance.now();
    function update(now) {
        const p = Math.min((now - t0) / 200, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        dayCountEl.textContent = Math.floor(start + (target - start) * eased);
        if (p < 1) requestAnimationFrame(update);
        else dayCountEl.textContent = target;
    }
    requestAnimationFrame(update);
}

function toggleMusic() {
    if (bgMusic.paused) {
        bgMusic.play().catch(() => {});
        musicToggle.textContent = '🎵';
    } else {
        bgMusic.pause();
        musicToggle.textContent = '🔇';
    }
}

function startGame() {
    bgMusic.volume = .55;
    bgMusic.play().catch(err => console.warn('音乐播放失败：', err));
    startScreen.style.opacity = '0';
    setTimeout(() => {
        startScreen.style.display = 'none';
        gameContainer.classList.add('active');
        musicToggle.classList.add('show');
    }, 800);
    resize();
    render();
}

startBtn.addEventListener('click', startGame);
canvas.addEventListener('click', onHeartClick);
canvas.addEventListener('touchstart', e => { e.preventDefault(); onHeartClick(e); }, { passive:false });
musicToggle.addEventListener('click', toggleMusic);
resize();
</script>
</body>
</html>
